baseURL = "https://www.troop924.org/"
title = "Troop 924 · Evanston"
theme = "beacon"
timeZone = "America/Chicago"

# Events are dated in the future on purpose; Hugo skips future-dated pages
# unless this is on. Past/upcoming is decided at build time, so the deploy
# workflow also rebuilds once a day.
buildFuture = true
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

# Events give startDate (plus optional startTime/endDate/endTime) instead of date.
[frontmatter]
  date = ["startDate", ":default"]

[markup.goldmark.renderer]
  unsafe = true   # lets imported legacy HTML pass through until it's cleaned up

[params]
  tagline = "Scouting in Evanston since 1926"
  description = "Troop 924 is a Scout-led troop for youth ages 11–17, meeting Tuesday nights at Northminster Presbyterian Church in Evanston, Illinois."
  email = "scoutmaster@troop924.org"
  # The troop's existing Google Calendar stays the master calendar.
  googleCalendar = "r5eoa80otpba34kdfni1o23qfk@group.calendar.google.com"
  charteredBy = "Chartered by Northminster Presbyterian Church · Scouting America"

  # The weekly troop meeting and monthly committee meeting live in data/meetings.yaml.

  [params.social]
    facebook = ""
    instagram = ""

[languages]
  [languages.en]
    direction = ''
    disabled = false
    label = 'English'
    locale = 'en-US'
    title = ''
    weight = 0

[menus]
  [[menus.main]]
    name = "Events"
    pageRef = "/events"
    weight = 10
  [[menus.main]]
    name = "Join"
    pageRef = "/join"
    weight = 20
  [[menus.main]]
    name = "For families"
    pageRef = "/families"
    weight = 30
  [[menus.main]]
    name = "Service"
    pageRef = "/service"
    weight = 40
  [[menus.main]]
    name = "Forms"
    pageRef = "/forms"
    weight = 50
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 60
